gateways:
  istio-egressgateway:
    enabled: true
    readinessProbe:
      failureThreshold: 30
      initialDelaySeconds: 1
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 0m
        memory: 0Mi

global:
  imagePullSecrets:
    - default-registry-key
  proxy:
    image: docker.io/istio/proxyv2:1.29.2
  proxy_init:
    image: docker.io/istio/proxyv2:1.29.2
