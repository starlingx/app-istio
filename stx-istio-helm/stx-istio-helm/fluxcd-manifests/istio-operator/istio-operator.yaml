apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  namespace: istio-system
  name: example-istiocontrolplane
spec:
  profile: demo
  components:
    cni:
      enabled: true
      k8s:
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 1
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
    pilot:
      enabled: true
      k8s:
        readinessProbe:
          failureThreshold: 4
          initialDelaySeconds: 1
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        readinessProbe:
          failureThreshold: 30
          initialDelaySeconds: 1
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
    egressGateways:
    - name: istio-egressgateway
      enabled: true
      k8s:
        readinessProbe:
          failureThreshold: 30
          initialDelaySeconds: 1
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
  values:
    sidecarInjectorWebhook:
      injectedAnnotations:
        k8s.v1.cni.cncf.io/networks: istio-cni
    cni:
      chained: false
      cniBinDir: /var/opt/cni/bin
      cniConfDir: /etc/cni/net.d
      cniConfFileName: istio-cni.conf
      excludeNamespaces:
        - kube-system
        - istio-operator
        - istio-system
      image: registry.local:9001/docker.io/istio/install-cni:1.22.1
    pilot:
      image: registry.local:9001/docker.io/istio/pilot:1.22.1
    global:
      imagePullSecrets:
        - default-registry-key
      proxy:
        image: registry.local:9001/docker.io/istio/proxyv2:1.22.1
      proxy_init:
        image: registry.local:9001/docker.io/istio/proxyv2:1.22.1
