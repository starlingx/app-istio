pilot:
  enabled: true
  image: docker.io/istio/pilot:1.28.1
  cni:
    enabled: true
  k8s:
    readinessProbe:
      failureThreshold: 30
      initialDelaySeconds: 1
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
  resources:
    requests:
      cpu: 0m
      memory: 0Mi
sidecarInjectorWebhook:
  injectedAnnotations:
    k8s.v1.cni.cncf.io/networks: istio-cni
global:
  imagePullSecrets:
    - default-registry-key
  proxy:
    image: docker.io/istio/proxyv2:1.28.1
  proxy_init:
    image: docker.io/istio/proxyv2:1.28.1
