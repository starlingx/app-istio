apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: base
  labels:
    chart_group: istio-charts
spec:
  releaseName: istio-istio-base
  chart:
    spec:
      chart: base
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 1m
  timeout: 30m
  test:
    enable: false
  install:
    disableHooks: false
    crds: Create
  upgrade:
    disableHooks: false
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: istio-base-static-overrides
      valuesKey: istio-base-static-overrides.yaml
    - kind: Secret
      name: istio-base-system-overrides
      valuesKey: istio-base-system-overrides.yaml
