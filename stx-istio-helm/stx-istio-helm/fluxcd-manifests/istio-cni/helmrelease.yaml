apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: cni
  labels:
    chart_group: istio-charts
spec:
  releaseName: istio-istio-cni
  chart:
    spec:
      chart: cni
      version: REPLACE_HELM_CHART_VERSION
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 1m
  timeout: 30m
  test:
    enable: false
  install:
    disableHooks: false
  upgrade:
    disableHooks: false
  dependsOn:
    - name: base
      namespace: istio-system
  valuesFrom:
    - kind: Secret
      name: istio-cni-static-overrides
      valuesKey: istio-cni-static-overrides.yaml
    - kind: Secret
      name: istio-cni-system-overrides
      valuesKey: istio-cni-system-overrides.yaml
