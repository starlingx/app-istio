replicaCount: 1
namespace: istio-system
deployment:
  image_name: quay.io/kiali/kiali
  image_pull_secrets: ["default-registry-key"]
  image_version: v2.18.0
  version_label: v2.18.0
  service_type: NodePort
  probes:
    liveness:
      failure_threshold: 3
      initial_delay_seconds: 5
      period_seconds: 30
      success_threshold: 1
      timeout_seconds: 5
    readiness:
      failure_threshold: 3
      initial_delay_seconds: 5
      period_seconds: 30
      success_threshold: 1
      timeout_seconds: 5
