- hosts: all
  tasks:
    - name: Check security reports directory exists
      stat:
        path: "{{ zuul.project.src_dir }}/python3-k8sapp-istio/k8sapp_istio/UTCoverage/"
      register: security_dir_stat

    - name: Upload security reports
      synchronize:
        src: "{{ zuul.project.src_dir }}/python3-k8sapp-istio/k8sapp_istio/UTCoverage/"
        dest: "{{ zuul.executor.log_root }}/security/"
        mode: pull
      when: security_dir_stat.stat.exists
      failed_when: false

    - name: Return security report artifact
      zuul_return:
        data:
          zuul:
            artifacts:
              - name: "Security Report"
                url: "security/security_report.txt"
      when: security_dir_stat.stat.exists
